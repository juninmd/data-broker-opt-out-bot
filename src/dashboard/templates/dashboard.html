<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Broker Opt-Out Dashboard</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --muted-text: #94a3b8;
            --accent-color: #38bdf8;
            --success-color: #22c55e;
            --warning-color: #eab308;
            --danger-color: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 32px;
        }

        h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 600;
        }

        .export-btn {
            background-color: var(--accent-color);
            color: #0f172a;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: background-color 0.2s;
        }

        .export-btn:hover {
            background-color: #0284c7;
            color: #ffffff;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 2fr 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--accent-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--muted-text);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-SUCCESS, .status-HEALTHY, .status-COMPLETED {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success-color);
        }

        .status-PENDING, .status-IN_PROGRESS, .status-DEGRADED {
            background-color: rgba(234, 179, 8, 0.2);
            color: var(--warning-color);
        }

        .status-FAILED, .status-ERROR, .status-DOWN {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Data Broker Opt-Out Dashboard</h1>
                <p style="color: var(--muted-text); margin: 4px 0 0 0;">Real-time request timeline and broker health monitor</p>
            </div>
            <div>
                <a href="/dashboard/export" class="export-btn" id="export-button">Export Data (CSV)</a>
            </div>
        </header>

        <div class="grid">
            <section class="card">
                <h2 class="card-title">Request Timeline</h2>
                <div id="timeline-container" hx-get="/dashboard/timeline" hx-trigger="load, every 5s" hx-swap="innerHTML">
                    <p style="color: var(--muted-text);">Loading timeline...</p>
                </div>
            </section>

            <section class="card">
                <h2 class="card-title">Broker Health</h2>
                <div id="health-container" hx-get="/dashboard/broker-health" hx-trigger="load, every 5s" hx-swap="innerHTML">
                    <p style="color: var(--muted-text);">Loading broker health...</p>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
